<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Unit 1</title>
<style>
:root{--bg:#f4f7f7;--panel:#fff;--ink:#13212a;--muted:#6b7280;--accent:#0f766e;--good:#16803a;--bad:#c73535;--border:#dde5e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:16px 15px 26px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}h1{margin:0;font-size:1.35rem}.muted{color:var(--muted);font-size:.9rem}.controls{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}select,button{font:inherit;border:1px solid var(--border);border-radius:12px;background:#fff;padding:11px 12px}button{cursor:pointer}.progresswrap{height:8px;background:#e3e8ea;border-radius:999px;overflow:hidden;margin:8px 0 14px}.progress{height:100%;width:0%;background:var(--accent);transition:width .2s}.flashcard{height:390px;perspective:1000px;cursor:pointer;user-select:none}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}.flashcard.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#edfdf8,#fff)}.badge{position:absolute;top:20px;left:20px;background:#e7f7f4;color:var(--accent);font-weight:700;font-size:.76rem;padding:6px 9px;border-radius:999px}.lang{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}.word{font-size:clamp(2rem,8vw,3.5rem);font-weight:780;line-height:1.12}.hint{position:absolute;bottom:22px;color:var(--muted);font-size:.88rem}.rating{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.rating button{font-weight:800;font-size:1rem;color:#fff;border:none;padding:13px}#wrong{background:var(--bad)}#right{background:var(--good)}.rating button:disabled{opacity:.35;cursor:not-allowed}.stats{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}.smallbtn{background:#fff}.overlay{display:none;background:#fff;border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.07)}.overlay.show{display:block}.overlay h2{margin-top:0;font-size:1.65rem}.overlay button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750}.mode-switch{width:100%;margin-top:16px;padding:15px 16px;background:#fff;color:var(--accent);border:2px solid var(--accent);border-radius:14px;font-size:1.02rem;font-weight:800;letter-spacing:.01em}.mode-switch:active{transform:scale(.99)}@media(max-height:720px){.flashcard{height:330px}}
</style></head><body><div class="app"><header><div><h1>Unit 1 · Flashcards</h1><div class="muted" id="directionLabel">Español → Inglés · repaso inteligente</div></div><div class="muted" id="roundLabel"></div></header><div class="controls"><select id="category"></select><button class="smallbtn" id="restart">↻ Reiniciar</button></div><div class="progresswrap"><div class="progress" id="progress"></div></div><div id="study"><div class="flashcard" id="card" tabindex="0"><div class="inner"><div class="face front"><div class="badge" id="catFront"></div><div class="lang" id="frontLang">Español</div><div class="word" id="frontWord"></div><div class="hint">Toca para ver la respuesta</div></div><div class="face back"><div class="badge" id="catBack"></div><div class="lang" id="backLang">English</div><div class="word" id="backWord"></div><div class="hint">Ahora marca ✓ o ✕</div></div></div></div><div class="rating"><button id="wrong" disabled>✕ La tuve mal</button><button id="right" disabled>✓ La sé</button></div><div class="stats"><span id="remaining"></span><span id="mistakes"></span><span id="mastered"></span></div></div><div class="overlay" id="done"><h2>🎉 Ronda terminada</h2><p id="doneText"></p><button id="nextRound">Empezar siguiente ronda</button></div><button id="directionBtn" class="mode-switch">⇄ Cambiar a: INGLÉS → ESPAÑOL</button></div>

lgado / ancho", "en": "baggy", "cat": "Adjetivos"}, {"id": 52, "es": "informal", "en": "casual", "cat": "Adjetivos"}, {"id": 53, "es": "colorido", "en": "colourful", "cat": "Adjetivos"}, {"id": 54, "es": "de diseñador / de marca", "en": "designer", "cat": "Adjetivos"}, {"id": 55, "es": "formal / de vestir", "en": "formal", "cat": "Adjetivos"}, {"id": 56, "es": "de manga larga", "en": "long-sleeved", "cat": "Adjetivos"}, {"id": 57, "es": "holgado", "en": "loose-fitting", "cat": "Adjetivos"}, {"id": 58, "es": "plisado", "en": "pleated", "cat": "Adjetivos"}, {"id": 59, "es": "de segunda mano", "en": "second-hand", "cat": "Adjetivos"}, {"id": 60, "es": "gastado / deteriorado / desaliñado", "en": "shabby", "cat": "Adjetivos"}, {"id": 61, "es": "de manga corta", "en": "short-sleeved", "cat": "Adjetivos"}, {"id": 62, "es": "elegante / bien arreglado", "en": "smart", "cat": "Adjetivos"}, {"id": 63, "es": "de buen gusto", "en": "tasteful", "cat": "Adjetivos"}, {"id": 64, "es": "ajustado / ceñido", "en": "tight-fitting", "cat": "Adjetivos"}, {"id": 65, "es": "de moda / moderno", "en": "trendy", "cat": "Adjetivos"}, {"id": 66, "es": "de moda", "en": "fashionable", "cat": "Adjetivos"}, {"id": 67, "es": "pasado de moda / poco a la moda", "en": "unfashionable", "cat": "Adjetivos"}, {"id": 68, "es": "impermeable", "en": "waterproof", "cat": "Adjetivos"}, {"id": 69, "es": "desgastado / muy gastado", "en": "worn out", "cat": "Adjetivos"}, {"id": 70, "es": "algodón", "en": "cotton", "cat": "Materiales"}, {"id": 71, "es": "tela vaquera / denim", "en": "denim", "cat": "Materiales"}, {"id": 72, "es": "cuero / piel", "en": "leather", "cat": "Materiales"}, {"id": 73, "es": "de lana", "en": "woollen", "cat": "Materiales"}, {"id": 74, "es": "nailon", "en": "nylon", "cat": "Materiales"}, {"id": 75, "es": "seda", "en": "silk", "cat": "Materiales"}, {"id": 76, "es": "ante", "en": "suede", "cat": "Materiales"}, {"id": 77, "es": "disfrazarse de alguien/algo", "en": "dress up as somebody/something", "cat": "Verbos"}, {"id": 78, "es": "quedar bien de talla / ser de la talla adecuada", "en": "fit", "cat": "Verbos"}, {"id": 79, "es": "vestirse", "en": "get dressed", "cat": "Verbos"}, {"id": 80, "es": "desvestirse", "en": "get undressed", "cat": "Verbos"}, {"id": 81, "es": "combinar con", "en": "go with", "cat": "Verbos"}, {"id": 82, "es": "hacer juego con / combinar", "en": "match", "cat": "Verbos"}, {"id": 83, "es": "ponerse", "en": "put on", "cat": "Verbos"}, {"id": 84, "es": "sentar bien / favorecer", "en": "suit", "cat": "Verbos"}, {"id": 85, "es": "quitarse", "en": "take off", "cat": "Verbos"}, {"id": 86, "es": "llevar puesto / vestir", "en": "wear", "cat": "Verbos"}];
let selectedCategory='Todas', round=1, queue=[], masteredIds=new Set(), mistakes=0, flipped=false, direction=localStorage.getItem('unit1direction')||'es-en';
const E=Object.fromEntries(['category','restart','progress','study','card','catFront','catBack','frontLang','backLang','frontWord','backWord','wrong','right','remaining','mistakes','mastered','done','doneText','nextRound','roundLabel','directionLabel','directionBtn'].map(id=>[id,document.getElementById(id)]));
const categories=['Todas',...new Set(ALL.map(c=>c.cat))]; E.category.innerHTML=categories.map(c=>`<option value="${c}">${c}</option>`).join('');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function baseCards(){return selectedCategory==='Todas'?ALL:ALL.filter(c=>c.cat===selectedCategory)}
function save(){localStorage.setItem('unit1state',JSON.stringify({selectedCategory,round,queue:queue.map(c=>c.id),mastered:[...masteredIds],mistakes,direction}));localStorage.setItem('unit1direction',direction)}
function restore(){try{const s=JSON.parse(localStorage.getItem('unit1state')||'null');if(!s)return false;selectedCategory=s.selectedCategory||'Todas';round=s.round||1;queue=(s.queue||[]).map(id=>ALL.find(c=>c.id===id)).filter(Boolean);masteredIds=new Set(s.mastered||[]);mistakes=s.mistakes||0;direction=localStorage.getItem('unit1direction')||s.direction||'es-en';E.category.value=selectedCategory;return queue.length>0}catch(e){return false}}
function startRound(inc=false){if(inc)round++;queue=shuffle(baseCards());masteredIds=new Set();mistakes=0;E.done.classList.remove('show');E.study.style.display='';save();render()}
function updateDirectionUI(){const esFirst=direction==='es-en';E.directionLabel.textContent=esFirst?'Español → Inglés · repaso inteligente':'Inglés → Español · repaso inteligente';E.frontLang.textContent=esFirst?'Español':'English';E.backLang.textContent=esFirst?'English':'Español';E.directionBtn.textContent=esFirst?'⇄ Cambiar a: INGLÉS → ESPAÑOL':'⇄ Cambiar a: ESPAÑOL → INGLÉS'}
function render(){if(queue.length===0){finishRound();return}const c=queue[0],esFirst=direction==='es-en';E.frontWord.textContent=esFirst?c.es:c.en;E.backWord.textContent=esFirst?c.en:c.es;E.catFront.textContent=c.cat;E.catBack.textContent=c.cat;updateDirectionUI();E.card.classList.remove('flipped');flipped=false;E.right.disabled=true;E.wrong.disabled=true;updateStats();save()}
function updateStats(){const total=baseCards().length,done=masteredIds.size;E.remaining.textContent=`Pendientes: ${queue.length}`;E.mistakes.textContent=`Fallos: ${mistakes}`;E.mastered.textContent=`Dominadas: ${done} / ${total}`;E.roundLabel.textContent=`Ronda ${round}`;E.progress.style.width=`${total?(done/total)*100:0}%`}
function flip(){if(!queue.length)return;E.card.classList.toggle('flipped');flipped=E.card.classList.contains('flipped');E.right.disabled=!flipped;E.wrong.disabled=!flipped}
function markRight(){if(!flipped||!queue.length)return;const c=queue.shift();masteredIds.add(c.id);render()}
function markWrong(){if(!flipped||!queue.length)return;const c=queue.shift();mistakes++;const gap=Math.random()<.5?4:5;queue.splice(Math.min(gap,queue.length),0,c);render()}
function finishRound(){E.study.style.display='none';E.done.classList.add('show');E.progress.style.width='100%';E.doneText.textContent=`Has completado las ${baseCards().length} tarjetas. Tuviste ${mistakes} fallos durante esta ronda.`;E.roundLabel.textContent=`Ronda ${round} completada`;updateDirectionUI();localStorage.removeItem('unit1state');localStorage.setItem('unit1direction',direction)}
E.card.onclick=flip;E.right.onclick=markRight;E.wrong.onclick=markWrong;E.nextRound.onclick=()=>startRound(true);E.restart.onclick=()=>startRound(false);E.category.onchange=()=>{selectedCategory=E.category.value;round=1;startRound(false)};E.directionBtn.onclick=()=>{direction=direction==='es-en'?'en-es':'es-en';localStorage.setItem('unit1direction',direction);if(queue.length)render();else updateDirectionUI()};
if(restore()){E.done.classList.remove('show');E.study.style.display='';render()}else startRound(false);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));}
</script></body></html>
