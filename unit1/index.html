<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>English Flashcards</title>
<style>
:root{--bg:#f4f7f7;--panel:#fff;--ink:#13212a;--muted:#6b7280;--accent:#0f766e;--good:#16803a;--bad:#c73535;--border:#dde5e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{max-width:720px;margin:auto;padding:16px 15px 26px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
h1{margin:0;font-size:1.35rem}
.muted{color:var(--muted);font-size:.9rem}
.controls{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:12px}
select,button{font:inherit;border:1px solid var(--border);border-radius:12px;background:#fff;padding:11px 12px}
button{cursor:pointer}
.progresswrap{height:8px;background:#e3e8ea;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.progress{height:100%;width:0%;background:var(--accent);transition:width .2s}
.flashcard{height:390px;perspective:1000px;cursor:pointer;user-select:none}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#edfdf8,#fff)}
.badge{position:absolute;top:20px;left:20px;background:#e7f7f4;color:var(--accent);font-weight:700;font-size:.76rem;padding:6px 9px;border-radius:999px}
.lang{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.word{font-size:clamp(2rem,8vw,3.5rem);font-weight:780;line-height:1.12}
.hint{position:absolute;bottom:22px;color:var(--muted);font-size:.88rem}
.rating{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rating button{font-weight:800;font-size:1rem;color:#fff;border:none;padding:13px}
#wrong{background:var(--bad)} #right{background:var(--good)}
.rating button:disabled{opacity:.35;cursor:not-allowed}
.stats{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}
.smallbtn{background:#fff}
.overlay{display:none;background:#fff;border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.07)}
.overlay.show{display:block}
.overlay h2{margin-top:0;font-size:1.65rem}
.overlay button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750}
.mode-switch{width:100%;margin-top:16px;padding:15px 16px;background:#fff;color:var(--accent);border:2px solid var(--accent);border-radius:14px;font-size:1.02rem;font-weight:800;letter-spacing:.01em}
.mode-switch:active{transform:scale(.99)}
.unit-switch{margin-top:10px}
.unit-modal{position:fixed;inset:0;z-index:50;background:rgba(19,33,42,.42);display:none;align-items:center;justify-content:center;padding:22px}
.unit-modal.show{display:flex}
.unit-panel{width:min(460px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.unit-panel h2{margin:0 0 6px;text-align:center;font-size:1.45rem}
.unit-panel p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:.9rem}
.unit-list{display:grid;gap:10px}
.unit-choice{width:100%;padding:16px;background:#fff;color:var(--accent);border:2px solid var(--accent);font-weight:800;font-size:1.05rem}
.unit-choice.current{background:var(--accent);color:#fff}
.close-units{width:100%;margin-top:12px;background:#f5f7f8;color:var(--ink)}
@media(max-height:720px){.flashcard{height:330px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <h1>English Flashcards</h1>
    <div class="muted" id="directionLabel"></div>
  </div>
  <div class="muted" id="roundLabel"></div>
</header>

<div class="controls">
  <select id="category" aria-label="Categoría"></select>
  <button class="smallbtn" id="restart">↻ Reiniciar</button>
</div>

<div class="progresswrap"><div class="progress" id="progress"></div></div>

<div id="study">
  <div class="flashcard" id="card" tabindex="0" role="button" aria-label="Toca para ver la respuesta">
    <div class="inner">
      <div class="face front">
        <div class="badge" id="catFront"></div>
        <div class="lang" id="frontLang">Español</div>
        <div class="word" id="frontWord"></div>
        <div class="hint">Toca para ver la respuesta</div>
      </div>
      <div class="face back">
        <div class="badge" id="catBack"></div>
        <div class="lang" id="backLang">English</div>
        <div class="word" id="backWord"></div>
        <div class="hint">Ahora marca ✓ o ✕</div>
      </div>
    </div>
  </div>

  <div class="rating">
    <button id="wrong" disabled>✕ La tuve mal</button>
    <button id="right" disabled>✓ La sé</button>
  </div>

  <div class="stats">
    <span id="remaining"></span>
    <span id="mistakes"></span>
    <span id="mastered"></span>
  </div>
</div>

<div class="overlay" id="done">
  <h2>🎉 Ronda terminada</h2>
  <p id="doneText"></p>
  <button id="nextRound">Empezar siguiente ronda</button>
</div>

<button id="directionBtn" class="mode-switch">⇄ Cambiar idioma</button>
<button id="unitBtn" class="mode-switch unit-switch">Unit 1</button>
</div>

<div class="unit-modal" id="unitModal" aria-hidden="true">
  <div class="unit-panel">
    <h2>Elige una unidad</h2>
    <p>Selecciona las tarjetas que quieres estudiar.</p>
    <div class="unit-list" id="unitList"></div>
    <button class="close-units" id="closeUnits">Cancelar</button>
  </div>
</div>

g team","cat":"Deportes: verbos"},{"id":117,"es":"batir un récord","en":"break a record","cat":"Deportes: verbos"},{"id":118,"es":"ostentar / tener un récord","en":"hold a record","cat":"Deportes: verbos"},{"id":119,"es":"practicar un deporte","en":"do / play a sport","cat":"Deportes: verbos"},{"id":120,"es":"empatar un partido","en":"draw a match / game","cat":"Deportes: verbos"},{"id":121,"es":"practicar / aficionarse a un deporte","en":"go in for a sport","cat":"Deportes: verbos"},{"id":122,"es":"perder un partido","en":"lose a game / match","cat":"Deportes: verbos"},{"id":123,"es":"practicar un tiro / golpe","en":"practise a shot","cat":"Deportes: verbos"},{"id":124,"es":"empezar a practicar un nuevo deporte","en":"take up a new sport","cat":"Deportes: verbos"},{"id":125,"es":"ganar una medalla","en":"win a medal","cat":"Deportes: verbos"},{"id":126,"es":"ganar un partido / competición","en":"win a match / competition / game","cat":"Deportes: verbos"}]}};
let currentUnit=localStorage.getItem('flashcards-current-unit')||'unit1';
if(!UNITS[currentUnit]) currentUnit='unit1';

let selectedCategory='Todas';
let round=1;
let queue=[];
let masteredIds=new Set();
let mistakes=0;
let flipped=false;
let direction=localStorage.getItem('flashcards-direction')||localStorage.getItem('unit1direction')||'es-en';

const E=Object.fromEntries([
  'category','restart','progress','study','card','catFront','catBack','frontLang','backLang',
  'frontWord','backWord','wrong','right','remaining','mistakes','mastered','done','doneText',
  'nextRound','roundLabel','directionLabel','directionBtn','unitBtn','unitModal','unitList','closeUnits'
].map(id=>[id,document.getElementById(id)]));

function cards(){return UNITS[currentUnit].cards}
function unitLabel(){return UNITS[currentUnit].label}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function baseCards(){
  return selectedCategory==='Todas' ? cards() : cards().filter(c=>c.cat===selectedCategory);
}

function stateKey(unit=currentUnit){return `flashcards-state-${unit}`}

function save(){
  localStorage.setItem(stateKey(),JSON.stringify({
    selectedCategory,round,queue:queue.map(c=>c.id),mastered:[...masteredIds],mistakes
  }));
  localStorage.setItem('flashcards-direction',direction);
  localStorage.setItem('flashcards-current-unit',currentUnit);
}

function migrateLegacyUnit1(){
  if(localStorage.getItem(stateKey('unit1'))) return;
  const legacy=localStorage.getItem('unit1state');
  if(!legacy) return;
  try{
    const s=JSON.parse(legacy);
    localStorage.setItem(stateKey('unit1'),JSON.stringify({
      selectedCategory:s.selectedCategory||'Todas',
      round:s.round||1,
      queue:s.queue||[],
      mastered:s.mastered||[],
      mistakes:s.mistakes||0
    }));
  }catch(_){
    // Si el estado antiguo no se puede leer, simplemente se empieza una ronda nueva.
  }
}
migrateLegacyUnit1();

function restore(){
  try{
    const s=JSON.parse(localStorage.getItem(stateKey())||'null');
    if(!s) return false;
    selectedCategory=s.selectedCategory||'Todas';
    round=s.round||1;
    queue=(s.queue||[]).map(id=>cards().find(c=>c.id===id)).filter(Boolean);
    masteredIds=new Set(s.mastered||[]);
    mistakes=s.mistakes||0;
    return queue.length>0;
  }catch(_){
    return false;
  }
}

function rebuildCategories(){
  const categories=['Todas',...new Set(cards().map(c=>c.cat))];
  if(!categories.includes(selectedCategory)) selectedCategory='Todas';
  E.category.innerHTML=categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  E.category.value=selectedCategory;
}

function startRound(increment=false){
  if(increment) round++;
  queue=shuffle(baseCards());
  masteredIds=new Set();
  mistakes=0;
  E.done.classList.remove('show');
  E.study.style.display='';
  render();
}

function updateDirectionUI(){
  const esFirst=direction==='es-en';
  E.directionLabel.textContent=`${unitLabel()} · ${esFirst?'Español → Inglés':'Inglés → Español'} · repaso inteligente`;
  E.frontLang.textContent=esFirst?'Español':'English';
  E.backLang.textContent=esFirst?'English':'Español';
  E.directionBtn.textContent=esFirst?'⇄ Cambiar a: INGLÉS → ESPAÑOL':'⇄ Cambiar a: ESPAÑOL → INGLÉS';
  E.unitBtn.textContent=unitLabel();
}

function resetCardToFrontInstantly(){
  const inner=E.card.querySelector('.inner');
  inner.style.transition='none';
  E.card.classList.remove('flipped');
  flipped=false;
  void inner.offsetWidth;
  return inner;
}

function render(){
  if(queue.length===0){
    finishRound();
    return;
  }

  const inner=resetCardToFrontInstantly();

  const c=queue[0];
  const esFirst=direction==='es-en';
  E.frontWord.textContent=esFirst?c.es:c.en;
  E.backWord.textContent=esFirst?c.en:c.es;
  E.catFront.textContent=c.cat;
  E.catBack.textContent=c.cat;

  updateDirectionUI();
  E.right.disabled=true;
  E.wrong.disabled=true;
  updateStats();
  save();

  requestAnimationFrame(()=>{inner.style.transition=''});
}

function updateStats(){
  const total=baseCards().length;
  const done=masteredIds.size;
  E.remaining.textContent=`Pendientes: ${queue.length}`;
  E.mistakes.textContent=`Fallos: ${mistakes}`;
  E.mastered.textContent=`Dominadas: ${done} / ${total}`;
  E.roundLabel.textContent=`Ronda ${round}`;
  E.progress.style.width=`${total?(done/total)*100:0}%`;
}

function flip(){
  if(!queue.length) return;
  E.card.classList.toggle('flipped');
  flipped=E.card.classList.contains('flipped');
  E.right.disabled=!flipped;
  E.wrong.disabled=!flipped;
}

function markRight(){
  if(!flipped||!queue.length) return;
  const c=queue.shift();
  masteredIds.add(c.id);
  render();
}

function markWrong(){
  if(!flipped||!queue.length) return;
  const c=queue.shift();
  mistakes++;
  const gap=Math.random()<.5?4:5;
  queue.splice(Math.min(gap,queue.length),0,c);
  render();
}

function finishRound(){
  E.study.style.display='none';
  E.done.classList.add('show');
  E.progress.style.width='100%';
  E.doneText.textContent=`Has completado las ${baseCards().length} tarjetas de ${unitLabel()}. Tuviste ${mistakes} fallos durante esta ronda.`;
  E.roundLabel.textContent=`Ronda ${round} completada`;
  updateDirectionUI();
  localStorage.removeItem(stateKey());
  localStorage.setItem('flashcards-current-unit',currentUnit);
  localStorage.setItem('flashcards-direction',direction);
}

function loadCurrentUnit(){
  selectedCategory='Todas';
  round=1;
  queue=[];
  masteredIds=new Set();
  mistakes=0;
  flipped=false;

  if(restore()){
    rebuildCategories();
    E.done.classList.remove('show');
    E.study.style.display='';
    render();
  }else{
    rebuildCategories();
    startRound(false);
  }
}

function openUnitModal(){
  E.unitList.innerHTML=Object.entries(UNITS).map(([key,u])=>
    `<button class="unit-choice ${key===currentUnit?'current':''}" data-unit="${key}">${u.label}</button>`
  ).join('');
  E.unitModal.classList.add('show');
  E.unitModal.setAttribute('aria-hidden','false');
}

function closeUnitModal(){
  E.unitModal.classList.remove('show');
  E.unitModal.setAttribute('aria-hidden','true');
}

function switchUnit(nextUnit){
  if(!UNITS[nextUnit]) return;
  save();
  currentUnit=nextUnit;
  localStorage.setItem('flashcards-current-unit',currentUnit);
  closeUnitModal();
  loadCurrentUnit();
}

E.card.onclick=flip;
E.card.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    flip();
  }
});
E.right.onclick=markRight;
E.wrong.onclick=markWrong;
E.nextRound.onclick=()=>startRound(true);
E.restart.onclick=()=>startRound(false);
E.category.onchange=()=>{
  selectedCategory=E.category.value;
  round=1;
  startRound(false);
};
E.directionBtn.onclick=()=>{
  direction=direction==='es-en'?'en-es':'es-en';
  localStorage.setItem('flashcards-direction',direction);
  if(queue.length) render(); else updateDirectionUI();
};
E.unitBtn.onclick=openUnitModal;
E.closeUnits.onclick=closeUnitModal;
E.unitList.onclick=e=>{
  const button=e.target.closest('[data-unit]');
  if(button) switchUnit(button.dataset.unit);
};
E.unitModal.onclick=e=>{
  if(e.target===E.unitModal) closeUnitModal();
};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeUnitModal();
});

loadCurrentUnit();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
